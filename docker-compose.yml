services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: "${PROJECT_NAME}_api"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: always
    volumes:
      - ./app/:/code/app
    environment:
      - PROJECT_NAME=${PROJECT_NAME}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: "${PROJECT_NAME}_celery_worker"
    command: sh -c "watchmedo auto-restart --directory=./ --pattern='*.py' --recursive -- celery -A app.worker.config worker --loglevel=info --concurrency=1 -E"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: always
    volumes:
      - ./app:/code/app
    environment:
      - PROJECT_NAME=${PROJECT_NAME}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  redis:
    container_name: "${PROJECT_NAME}_redis"
    healthcheck:
      interval: 30s
      retries: 5
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 10s
    image: redis:latest
    ports:
      - "127.0.0.1:6379:6379"
    restart: always
    volumes:
      - redis_data:/data

  kanchi:
    image: getkanchi/kanchi:1.3
    container_name: "${PROJECT_NAME}_kanchi"
    ports:
      - "3000:3000"
      - "8765:8765"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      DATABASE_URL: sqlite:////data/kanchi.db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTH_ENABLED: "true"
      AUTH_BASIC_ENABLED: "true"
      BASIC_AUTH_USERNAME: ${KANCHI_AUTH_USERNAME:-admin}
      BASIC_AUTH_PASSWORD_HASH: ${KANCHI_AUTH_PASSWORD_HASH}
      SESSION_SECRET_KEY: ${KANCHI_SESSION_SECRET:-}
      TOKEN_SECRET_KEY: ${KANCHI_TOKEN_SECRET:-}
      NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL:-http://localhost:8765}
      NUXT_PUBLIC_WS_URL: ${NUXT_PUBLIC_WS_URL:-ws://localhost:8765/ws}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - kanchi_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    container_name: "${PROJECT_NAME}_db"
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "${POSTGRES_USER}",
          "-h",
          "localhost"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  db_data:
  redis_data:
  kanchi_data:
